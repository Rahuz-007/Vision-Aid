<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisionAid — You're Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .icon-ring {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #EC4899);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
            }

            50% {
                box-shadow: 0 0 80px rgba(139, 92, 246, 0.7);
            }
        }

        .icon-ring svg {
            width: 48px;
            height: 48px;
            fill: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 12px;
        }

        p {
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 0.97rem;
        }

        .pill {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .pill:hover {
            opacity: 0.85;
        }

        .tips {
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 24px;
        }

        .tips p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #EF4444;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon-ring">
            <!-- Eye icon inline SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path
                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
            </svg>
        </div>

        <h1>You're Offline</h1>
        <p>
            VisionAid needs an internet connection to load new content.
            Check your connection and try again — your saved colors are still available locally.
        </p>

        <button class="pill" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="tips">
            <p>VisionAid works best with a stable connection for real-time AI detection.</p>
            <div class="badge">
                <span class="dot"></span>
                No connection detected
            </div>
        </div>
    </div>
</body>

</html>
