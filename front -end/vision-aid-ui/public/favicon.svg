<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="16" y1="32" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="14" fill="white" fill-opacity="0.05"/>

  <!-- Eye outline (vision) -->
  <path d="M10 32 C18 18, 46 18, 54 32 C46 46, 18 46, 10 32Z"
        fill="url(#eyeGrad)" filter="url(#glow)"/>

  <!-- Iris ring -->
  <circle cx="32" cy="32" r="9" fill="#8B5CF6" opacity="0.9"/>

  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#1E1B4B"/>

  <!-- Highlight dot -->
  <circle cx="34.5" cy="29" r="2" fill="white" opacity="0.8"/>

  <!-- Color spectrum dots at corners — branding accent -->
  <circle cx="14" cy="48" r="3" fill="#34D399" opacity="0.9"/>
  <circle cx="50" cy="48" r="3" fill="#F472B6" opacity="0.9"/>
  <circle cx="14" cy="16" r="3" fill="#60A5FA" opacity="0.9"/>
  <circle cx="50" cy="16" r="3" fill="#FBBF24" opacity="0.9"/>
</svg>
