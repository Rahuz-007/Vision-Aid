name: Deploy to Production

# ==============================================================================
# VISION AID - PRODUCTION DEPLOYMENT WORKFLOW
# ==============================================================================
# This workflow automates the deployment process for the Vision Aid application.
# It handles building Docker images, pushing them to the registry, and deploying
# to both staging and production environments.
#
# TRIGGERS:
# - Push to 'main' or 'master' branches
# - Creation of version tags (e.g., v1.0.0)
# - Manual trigger via GitHub Actions UI
#
# PRE-REQUISITES:
# - GitHub Secrets must be configured (DOCKER_USERNAME, DOCKER_PASSWORD, SSH_KEYS, etc.)
# - Docker Registry must be accessible
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # JOB: BUILD DOCKER IMAGES
  # Builds and pushes optimized Docker images for Backend and Frontend services.
  # ----------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate versioning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: ./Back-end
          file: ./Back-end/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./front -end/vision-aid-ui
          file: ./front -end/vision-aid-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
            REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
            REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}

  # ----------------------------------------------------------------------------
  # JOB: DEPLOY TO SERVER
  # Deploys the application to the VPS using SSH and Docker Compose.
  # NOTE: Runs only on main/master branch pushes.
  # ----------------------------------------------------------------------------
  deploy-server:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/vision-aid' }}

            echo "🚀 Starting Deployment..."

            # Pull latest images from registry
            docker-compose pull

            # Restart services with zero downtime (if configured)
            docker-compose up -d --remove-orphans

            # Clean up old/unused images to save disk space
            docker image prune -af

            # Health Check
            echo "🏥 Checking Service Health..."
            sleep 10
            docker-compose ps

            echo "✅ Deployment Successful!"

      - name: Notify Deployment Status
        if: always()
        run: |
          echo "🚀 Deployment triggered for ${{ github.ref }}"
          echo "📦 Images: backend, frontend"
          echo "🌍 Environment: production"

  # ----------------------------------------------------------------------------
  # JOB: DEPLOY TO VERCEL (FRONTEND ONLY)
  # Alternative deployment strategy for the frontend using Vercel.
  # ----------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          cd "front -end/vision-aid-ui"
          npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ----------------------------------------------------------------------------
  # JOB: POST-DEPLOYMENT HEALTH CHECK
  # Verifies that specific endpoints are reachable after deployment.
  # ----------------------------------------------------------------------------
  health-check:
    name: Post-Deployment Health Check
    needs: [deploy-server]
    runs-on: ubuntu-latest
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Wait for Propagation
        run: sleep 30

      - name: Check Backend Health
        if: ${{ secrets.BACKEND_URL != '' }}
        run: |
          curl -f ${{ secrets.BACKEND_URL }}/health || echo "⚠️ Backend health check failed"

      - name: Check Frontend Availability
        if: ${{ secrets.FRONTEND_URL != '' }}
        run: |
          curl -f ${{ secrets.FRONTEND_URL }} || echo "⚠️ Frontend health check failed"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Pipeline Complete"
          echo "🔍 Please review the job logs above for any warnings or errors."
